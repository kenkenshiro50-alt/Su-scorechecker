<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SU Score888</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
:root{--bg:#0d0d0d;--card:#1a1a1a;--card2:#232323;--line:#2c2c2c;--text:#f2f2f2;--muted:#8d8d8d;--green:#00985f;--red:#ff4b4b;--accent:#1ed760}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Tahoma,sans-serif;font-size:14px}
.small{color:var(--muted);font-size:12px}
.mt{margin:8px 0 10px;line-height:1.7}

/* Header */
header{position:sticky;top:0;z-index:20;background:#111;border-bottom:1px solid var(--line)}
.nav{max-width:1100px;margin:auto;display:flex;align-items:center;gap:20px;padding:12px 16px}
.logo{font-weight:800;font-size:20px;color:var(--accent);letter-spacing:-.5px}
.nav a{color:var(--muted);font-weight:600;cursor:pointer;padding:6px 2px;border-bottom:2px solid transparent}
.nav a.active{color:#fff;border-color:var(--accent)}
.search{margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px 14px;color:#fff;width:200px;outline:none}
.reload{background:var(--card);border:1px solid var(--line);color:#fff;border-radius:50%;width:36px;height:36px;cursor:pointer}
.reload.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Layout */
main{max-width:1100px;margin:auto;padding:16px;display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
@media(max-width:900px){main{grid-template-columns:1fr}.search{width:130px}.nav a{display:none}}

/* Dates */
.dates{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.date{flex:none;min-width:68px;text-align:center;background:var(--card);border-radius:12px;padding:8px 6px;cursor:pointer}
.date small{display:block;color:var(--muted);font-size:11px}
.date b{font-size:15px}
.date.active{background:var(--green)}
.date.active small{color:#d6ffe9}

/* Filters */
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 14px;cursor:pointer;color:var(--muted);font-weight:600}
.chip.active{background:#fff;color:#000}

/* League + rows */
.league{background:var(--card);border-radius:14px;margin-bottom:12px;overflow:hidden}
.lh{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
.lh small{color:var(--muted);display:block;font-size:11px}
.lh .arrow{margin-left:auto;color:var(--muted);transition:.2s}
.league.closed .arrow{transform:rotate(-90deg)}
.league.closed .matches{display:none}

.match{display:grid;grid-template-columns:56px 1fr 64px 1fr 30px;align-items:center;gap:6px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.match:last-child{border:0}
.match:hover{background:var(--card2)}
.status{font-size:12px;color:var(--muted);text-align:center}
.status.live{color:var(--red);font-weight:700}
.team{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.team .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team.home{flex-direction:row-reverse;text-align:right}
.score{text-align:center;font-weight:800;font-size:15px;background:var(--card2);border-radius:6px;padding:3px 0;white-space:nowrap}
.score.live{color:var(--red)}
.score.ns{color:var(--muted);background:none;font-weight:500}
.star{cursor:pointer;color:#555;font-size:18px;text-align:center}
.star.on{color:#ffc928}
.empty{padding:40px;text-align:center;color:var(--muted)}
.source{color:var(--muted);font-size:12px;text-align:center;margin-top:8px}
@media(max-width:520px){.match{grid-template-columns:44px 1fr 54px 1fr 24px;padding:10px 8px;font-size:13px}}

/* Crest / logo */
.crest{position:relative;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:800;color:#fff;flex:none}
.crest img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.crest.has-logo{background:transparent!important;color:transparent}
.crest.lg{width:72px;height:72px;font-size:20px}

/* Sidebar */
.side .box{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.side h3{font-size:14px}
.box-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
select{background:var(--card2);color:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px}
.btn{width:100%;background:var(--card2);color:#fff;border:1px solid var(--line);border-radius:10px;padding:9px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--green);border-color:var(--green)}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 3px;text-align:center}
th{color:var(--muted);font-weight:500}
td:nth-child(2),th:nth-child(2){text-align:left}
tr.cl td:first-child{box-shadow:inset 3px 0 var(--accent)}
tr.rel td:first-child{box-shadow:inset 3px 0 var(--red)}
.tt{display:flex;align-items:center;gap:6px}
#history div{padding:3px 0;border-bottom:1px dashed var(--line)}

/* Dialog */
.match-dialog{width:min(860px,calc(100% - 24px));margin:auto;padding:0;border:0;border-radius:18px;background:var(--card);color:var(--text)}
.match-dialog::backdrop{background:#000b;backdrop-filter:blur(3px)}
.dialog-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.dialog-head h2{font-size:17px}
.x{background:none;border:0;color:var(--muted);font-size:26px;cursor:pointer;line-height:1}
.match-details{padding:24px 20px}
.match-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.match-team{display:grid;justify-items:center;gap:10px;font-weight:700;min-width:0}
.match-score{font-size:34px;font-weight:800;white-space:nowrap}
.match-meta{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;color:var(--muted)}
.badge{padding:3px 10px;border-radius:999px;background:var(--card2);font-size:12px;color:var(--text)}
.badge.live{background:var(--red);color:#fff}
/* ===== เพิ่มใหม่ ===== */
.leagues{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.leagues .chip{flex:none;white-space:nowrap}
.match-dialog{max-height:90vh;overflow:auto}
.lu{margin-top:18px}
.lu h4{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:14px}
.pl{display:flex;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line);font-size:13px}
.pl b{width:26px;color:var(--muted);flex:none}
.pl .pos{margin-left:auto;color:var(--muted);text-align:right}
.link{cursor:pointer}
.link:hover{color:var(--accent)}
.warn{color:var(--red)}

/* ===== FotMob-style layout ===== */
.pitch-head{display:flex;justify-content:space-between;align-items:center;background:#3f9a62;border-radius:12px 12px 0 0;padding:10px 14px;margin-top:18px;color:#fff}
.pb{display:flex;align-items:center;gap:8px}.pb.r{flex-direction:row-reverse}.pb small{opacity:.85}
.pitch{position:relative;width:100%;aspect-ratio:16/10;background:#3f9a62;border-radius:0 0 12px 12px;overflow:hidden}
.pitch::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid #ffffff55}
.pitch::after{content:"";position:absolute;left:50%;top:50%;width:18%;aspect-ratio:1;border:2px solid #ffffff55;border-radius:50%;transform:translate(-50%,-50%)}
.pp{position:absolute;transform:translate(-50%,-50%);text-align:center;width:76px;font-size:11px;font-weight:700;color:#fff;z-index:1}
.pp .crest{width:40px;height:40px;font-size:12px;border:2px solid #fff;margin:auto}
.pp .crest.has-logo{background:#e8e8e8!important}
.pp .so{position:absolute;top:-4px;right:12px;background:var(--red);border-radius:50%;width:16px;height:16px;font-size:10px;line-height:16px;font-style:normal}
.pn{display:block;margin-top:2px;text-shadow:0 1px 2px #000b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subs{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
@media(max-width:600px){.pitch{aspect-ratio:3/4}.pp{width:56px;font-size:10px}.pp .crest{width:32px;height:32px}.subs{grid-template-columns:1fr}}
[hidden]{display:none!important}
main{max-width:1320px;grid-template-columns:210px minmax(0,1fr) 320px}
.left{background:var(--card);border-radius:14px;padding:10px;position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto}
.left h3{font-size:12px;color:var(--muted);padding:6px 8px;text-transform:uppercase;letter-spacing:.5px}
.lg-item{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px}
.lg-item .crest{width:20px;height:20px;font-size:8px}
.lg-item small{margin-left:auto;color:var(--muted)}
.lg-item:hover{background:var(--card2)}
.lg-item.active{background:var(--green)}
.lt{font-size:22px;margin-bottom:10px}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs a{padding:8px 2px;cursor:pointer;color:var(--muted);font-weight:700;border-bottom:3px solid transparent}
.tabs a.active{color:#fff;border-color:var(--accent)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tcard{background:var(--card);border-radius:12px;padding:16px 8px;display:grid;justify-items:center;gap:8px;text-align:center;font-weight:600;font-size:13px}
.tcard:hover{background:var(--card2)}
@media(max-width:1100px){main{grid-template-columns:1fr}.left{position:static;max-height:none;display:flex;gap:6px;overflow-x:auto}.left h3{display:none}.lg-item{flex:none;white-space:nowrap}}

</style>
</head>
<body>
  <header>
    <div class="nav">
      <div class="logo">SU Score888</div>
      <a class="active">แมตช์</a>
      <input class="search" id="q" placeholder="ค้นหาทีม">
      <button class="reload" id="reload" title="โหลดข้อมูลใหม่">🔄</button>
    </div>
  </header>

  <main>
    <nav class="left" id="leagues"></nav>
    <section>
      <div id="tabs"></div>
      <div id="alt" hidden></div>
      <div class="dates" id="dates"></div>
      <div class="filters" id="filters"></div>
      <div id="list"><div class="empty">กำลังโหลด...</div></div>
      <div class="source" id="source"></div>
    </section>

    <aside class="side">
      <div class="box">
        <div class="box-head">
          <h3 id="stTitle">ตารางคะแนน</h3>
          <select id="sort">
            <option value="selection">Selection Sort</option>
            <option value="insertion">Insertion Sort</option>
            <option value="bubble">Bubble Sort</option>
          </select>
        </div>
        <div id="table"></div>
        <div class="small" id="sorttime"></div>
      </div>

      <div class="box">
        <h3>Queue (FIFO)</h3>
        <p class="small">คิวการแข่งขันที่กำลังรอ/กำลังแข่ง</p>
        <div id="queue" class="mt"></div>
        <button class="btn" id="btnQueue">นำรายการถัดไปออกจากคิว</button>
      </div>

      <div class="box">
        <h3>Stack (LIFO) / History</h3>
        <div id="history" class="mt"></div>
        <button class="btn" id="btnUndo">↩ Undo ล่าสุด</button>
      </div>
    </aside>
  </main>

  <dialog id="matchDialog" class="match-dialog">
    <div class="dialog-head">
      <h2 id="dialogTitle">รายละเอียดการแข่งขัน</h2>
      <button type="button" class="x" id="btnClose" aria-label="ปิด">×</button>
    </div>
    <div id="matchDetails" class="match-details"></div>
  </dialog>

  <script>
/* ================= Helpers ================= */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hash = s => [...String(s)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) | 0, 7);
const color = n => `hsl(${Math.abs(hash(n)) % 360},55%,42%)`;
const initials = n => String(n).replace(/[^A-Za-z ]/g, '').split(' ').filter(Boolean).map(w => w[0]).join('').slice(0, 3).toUpperCase() || '?';
const fmtTime = s => new Date(s).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
const fmtDate = s => new Date(s).toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' });

function crest(name, logo, big) {
  const img = logo
    ? `<img src="${esc(logo)}" alt="" loading="lazy" onerror="this.parentNode.classList.remove('has-logo');this.remove()">`
    : '';
  return `<span class="crest ${logo ? 'has-logo' : ''} ${big ? 'lg' : ''}" style="background:${color(name)}">${esc(initials(name))}${img}</span>`;
}

function statusTH(s) {
  return ({ FINISHED: 'จบแล้ว', SCHEDULED: 'กำลังจะเริ่ม', TIMED: 'กำลังจะเริ่ม', IN_PLAY: 'กำลังแข่ง', PAUSED: 'พักครึ่ง', POSTPONED: 'เลื่อน', CANCELLED: 'ยกเลิก', SUSPENDED: 'ระงับ' })[s] || s;
}
function statusInfo(m) {
  switch (m.status) {
    case 'IN_PLAY': case 'LIVE': return { k: 'live', t: 'LIVE' };
    case 'PAUSED': return { k: 'live', t: 'HT' };
    case 'FINISHED': case 'AWARDED': return { k: 'ft', t: 'FT' };
    case 'POSTPONED': return { k: 'ns', t: 'เลื่อน' };
    case 'CANCELLED': case 'SUSPENDED': return { k: 'ns', t: 'ยกเลิก' };
    default: return { k: 'ns', t: fmtTime(m.utcDate) };
  }
}

async function api(url, opt = {}) {
  const r = await fetch(url, opt);
  let d = {};
  try { d = await r.json(); } catch { /* ignore */ }
  if (!r.ok) throw new Error(d.error || 'Request failed');
  return d;
}

function loadFavs() {
  try { return JSON.parse(localStorage.getItem('favs') || '[]'); } catch { return []; }
}
function saveFavs() {
  try { localStorage.setItem('favs', JSON.stringify(S.favs)); } catch { /* ignore */ }
}

/* ================= State ================= */
const S = {
  matches: [],
  byId: new Map(),
  leagues: [],
  league: 'all',
  date: dkey(new Date()),
  filter: 'all',
  tab: 'matches',
  query: '',
  favs: loadFavs(),
  closed: new Set()
};

/* ================= Matches ================= */
async function loadLeagues() {
  const d = await api('/api/leagues');
  S.leagues = d.data || [];
}

async function loadMatches() {
  const d = await api('/api/matches');
  S.matches = d.data || [];
  S.byId = new Map(S.matches.map(m => [m.id, m]));
  $('#source').textContent = 'แหล่งข้อมูล: ' + (d.source || '-');
  pickDefaultDate();
  render();
}

function pickDefaultDate() {
  const keys = [...new Set(S.matches.map(m => dkey(new Date(m.utcDate))))];
  const today = dkey(new Date());
  if (S.date && keys.includes(S.date)) return;
  if (!keys.length || keys.includes(today)) { S.date = today; return; }
  const now = Date.now();
  keys.sort((a, b) => Math.abs(new Date(a + 'T12:00:00') - now) - Math.abs(new Date(b + 'T12:00:00') - now));
  S.date = keys[0];
}

function renderDates() {
  const today = dkey(new Date());
  const keys = new Set(S.matches.map(m => dkey(new Date(m.utcDate))));
  keys.add(today);
  $('#dates').innerHTML = [...keys].sort().map(k => {
    const d = new Date(k + 'T00:00:00');
    return `<div class="date ${k === S.date ? 'active' : ''}" data-d="${k}">
      <small>${k === today ? 'วันนี้' : d.toLocaleDateString('th-TH', { weekday: 'short' })}</small>
      <b>${d.getDate()}/${d.getMonth() + 1}</b></div>`;
  }).join('');
  const act = $('#dates .active');
  if (act) act.scrollIntoView({ inline: 'center', block: 'nearest' });
}

function renderLeagues() {
  const item = (code, name, n, logo) =>
    `<div class="lg-item ${S.league === code ? 'active' : ''}" data-l="${esc(code)}">${crest(name, logo || null)}<span>${esc(name)}</span>${n ? `<small>${n}</small>` : ''}</div>`;
  $('#leagues').innerHTML = '<h3>ลีก</h3>' + item('all', 'ทุกลีก', 0) +
    S.leagues.map(l => item(l.code, l.name, l.matches, l.logo)).join('');
}

function renderTabs() {
  const lg = S.leagues.find(l => l.code === S.league);
  $('#tabs').innerHTML = !lg ? '' :
    `<h2 class="lt" style="display:flex;align-items:center;gap:10px">${crest(lg.name, lg.logo, true)}${esc(lg.name)}</h2><div class="tabs">${[['matches', 'แมตช์'], ['table', 'ตาราง'], ['teams', 'ทีม']]
      .map(([k, l]) => `<a class="${S.tab === k ? 'active' : ''}" data-tab="${k}">${l}</a>`).join('')}</div>`;
}

async function renderAlt() {
  const code = S.league, box = $('#alt');
  box.innerHTML = '<div class="empty">กำลังโหลด...</div>';
  try {
    if (S.tab === 'table') {
      const d = await api(`/api/standings?league=${encodeURIComponent(code)}&sort=${$('#sort').value}`);
      box.innerHTML = d.data.length
        ? `<div class="league"><table><thead><tr><th>#</th><th>ทีม</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead><tbody>${
          d.data.map((t, i) => `<tr><td>${i + 1}</td><td><div class="tt link" ${t.teamId ? `data-team="${t.teamId}" data-lg="${esc(code)}"` : ''}>${crest(t.team, t.logo)}<span>${esc(t.team)}</span></div></td><td>${t.playedGames}</td><td>${t.won}</td><td>${t.draw}</td><td>${t.lost}</td><td>${t.goalsFor}</td><td>${t.goalsAgainst}</td><td>${t.goalDifference}</td><td><b>${t.points}</b></td></tr>`).join('')
        }</tbody></table></div>`
        : '<div class="empty">ไม่มีตารางคะแนนของลีกนี้</div>';
    } else {
      const d = await api('/api/teams?league=' + encodeURIComponent(code));
      box.innerHTML = d.data.length
        ? `<div class="tgrid">${d.data.map(t => `<div class="tcard link" data-team="${t.id}" data-lg="${esc(code)}">${crest(t.name, t.logo, true)}<span>${esc(t.name)}</span></div>`).join('')}</div>`
        : '<div class="empty">ไม่พบรายชื่อทีม</div>';
    }
  } catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

function renderFilters() {
  const f = [['all', 'ทั้งหมด'], ['live', '<i class="fa-solid fa-signal-stream"></i> สด'], ['ft', 'จบแล้ว'], ['ns', 'ยังไม่แข่ง'], ['fav', '⭐ ทีมโปรด']];
  $('#filters').innerHTML = f.map(([k, l]) =>
    `<div class="chip ${S.filter === k ? 'active' : ''}" data-f="${k}">${l}</div>`).join('');
}

function matchRow(m) {
  const st = statusInfo(m);
  const hasScore = m.homeScore != null && m.awayScore != null;
  const fav = S.favs.includes(m.homeTeam) || S.favs.includes(m.awayTeam);
  return `<div class="match" data-id="${m.id}">
    <div class="status ${st.k === 'live' ? 'live' : ''}">${st.k === 'live' ? '<i class="fa-solid fa-signal-stream" title="LIVE"></i>' : esc(st.t)}</div>
    <div class="team home">${crest(m.homeTeam, m.homeTeamLogo)}<span class="n">${esc(m.homeTeam)}</span></div>
    <div class="score ${st.k === 'live' ? 'live' : st.k === 'ns' ? 'ns' : ''}">${hasScore ? `${m.homeScore} - ${m.awayScore}` : 'vs'}</div>
    <div class="team">${crest(m.awayTeam, m.awayTeamLogo)}<span class="n">${esc(m.awayTeam)}</span></div>
    <div class="star ${fav ? 'on' : ''}" data-star="${m.id}" title="ทีมโปรด">★</div>
  </div>`;
}

function renderMatches() {
  const q = S.query.trim().toLowerCase();
  const ms = S.matches
    .filter(m => dkey(new Date(m.utcDate)) === S.date)
    .filter(m => S.league === 'all' || m.leagueCode === S.league)
    .filter(m => {
      if (S.filter === 'live') return ['IN_PLAY', 'LIVE', 'PAUSED'].includes(m.status);
      if (S.filter === 'ft') return ['FINISHED', 'AWARDED'].includes(m.status);
      if (S.filter === 'ns') return ['SCHEDULED', 'TIMED'].includes(m.status);
      if (S.filter === 'fav') return S.favs.includes(m.homeTeam) || S.favs.includes(m.awayTeam);
      return true;
    })
    .filter(m => !q || m.homeTeam.toLowerCase().includes(q) || m.awayTeam.toLowerCase().includes(q));

  if (!ms.length) { $('#list').innerHTML = '<div class="empty">ไม่พบแมตช์</div>'; return; }

  const groups = new Map();
  ms.forEach(m => {
    if (!groups.has(m.leagueCode)) groups.set(m.leagueCode, { name: m.league, rows: [] });
    groups.get(m.leagueCode).rows.push(m);
  });
  const logoOf = code => (S.leagues.find(l => l.code === code) || {}).logo || null;

  $('#list').innerHTML = [...groups].map(([code, g]) => `
    <div class="league ${S.closed.has(code) ? 'closed' : ''}">
      <div class="lh" data-lg="${esc(code)}">
        ${crest(g.name, logoOf(code))}<div><b>${esc(g.name)}</b><small>${g.rows.length} แมตช์</small></div>
        <span class="arrow">▾</span>
      </div>
      <div class="matches">${g.rows.map(matchRow).join('')}</div>
    </div>`).join('');
}

function render() {
  renderLeagues();
  renderTabs();
  const home = S.league === 'all' || S.tab === 'matches';
  ['#dates', '#filters', '#list'].forEach(s => { $(s).hidden = !home; });
  $('#alt').hidden = home;
  if (home) { renderDates(); renderFilters(); renderMatches(); } else renderAlt();
}

/* ================= Standings ================= */
function standingsCode() { return S.league === 'all' ? 'eng.1' : S.league; }

async function loadStandings() {
  const code = standingsCode();
  const algo = $('#sort').value;
  const lg = S.leagues.find(l => l.code === code);
  $('#stTitle').textContent = '🏆 ' + (lg ? lg.name : 'ตารางคะแนน');
  try {
    const d = await api(`/api/standings?league=${encodeURIComponent(code)}&sort=${algo}`);
    if (!d.data.length) {
      $('#table').innerHTML = '<div class="empty">ไม่มีตารางคะแนนของลีกนี้</div>';
      $('#sorttime').textContent = '';
      return;
    }
    const n = d.data.length;
    $('#table').innerHTML = `<table><thead><tr><th>#</th><th>ทีม</th><th>แข่ง</th><th>GD</th><th>Pts</th></tr></thead><tbody>${
      d.data.map((t, i) => `<tr class="${i < 4 ? 'cl' : ''} ${n > 10 && i >= n - 3 ? 'rel' : ''}">
        <td>${i + 1}</td>
        <td><div class="tt link" ${t.teamId ? `data-team="${t.teamId}" data-lg="${esc(code)}"` : ''}>${crest(t.team, t.logo)}<span>${esc(t.team)}</span></div></td>
        <td>${t.playedGames}</td><td>${t.goalDifference}</td><td><b>${t.points}</b></td></tr>`).join('')
    }</tbody></table>`;
    $('#sorttime').textContent = `ใช้ ${d.algorithm} Sort: ${d.ms} ms`;
  } catch (e) {
    $('#table').innerHTML = `<div class="empty">โหลดตารางไม่ได้: ${esc(e.message)}</div>`;
  }
}

/* ================= Queue / History ================= */
async function loadQueue() {
  const d = await api('/api/queue');
  $('#queue').innerHTML = d.next
    ? `ถัดไป: <b>${esc(d.next.homeTeam)} vs ${esc(d.next.awayTeam)}</b><br>จำนวนในคิว: ${d.size}`
    : 'คิวว่าง';
}

async function loadHistory() {
  const d = await api('/api/history');
  const rows = d.data || [];
  $('#history').innerHTML = rows.length
    ? rows.slice(0, 8).map(h => `<div>• ${esc(h.action)}: ${esc(h.match.homeTeam)} vs ${esc(h.match.awayTeam)} <span class="small">${esc(h.time)}</span></div>`).join('')
    : 'ยังไม่มีประวัติ';
}

/* ================= Dialog ================= */
function openDialog(title, html) {
  $('#dialogTitle').textContent = title;
  $('#matchDetails').innerHTML = html;
  const dlg = $('#matchDialog');
  if (!dlg.open) dlg.showModal();
}

function playerRows(list) {
  return list.map(p => `<div class="pl"><b>${esc(p.jersey ?? '')}</b><span>${esc(p.name)}</span><span class="pos">${esc(p.position ?? '')}</span></div>`).join('');
}

function lineupHTML(side) {
  if (!side) return '';
  return `<div class="lu">
    <h4>${crest(side.team, side.logo)}<span>${esc(side.team)}</span>
      ${side.formation ? `<span class="badge">แผน ${esc(side.formation)}</span>` : ''}</h4>
    <div class="small">ตัวจริง</div>${playerRows(side.starters)}
    <div class="small" style="margin-top:8px">ตัวสำรอง</div>${playerRows(side.substitutes)}
  </div>`;
}

function matchHeader(m) {
  const st = statusInfo(m);
  const hasScore = m.homeScore != null && m.awayScore != null;
  return `<div class="match-teams">
      <div class="match-team ${m.homeTeamId ? 'link' : ''}" ${m.homeTeamId ? `data-team="${m.homeTeamId}" data-lg="${esc(m.leagueCode)}"` : ''}>${crest(m.homeTeam, m.homeTeamLogo, true)}<span>${esc(m.homeTeam)}</span></div>
      <div class="match-score">${hasScore ? `${m.homeScore} - ${m.awayScore}` : 'vs'}</div>
      <div class="match-team ${m.awayTeamId ? 'link' : ''}" ${m.awayTeamId ? `data-team="${m.awayTeamId}" data-lg="${esc(m.leagueCode)}"` : ''}>${crest(m.awayTeam, m.awayTeamLogo, true)}<span>${esc(m.awayTeam)}</span></div>
    </div>
    <div class="match-meta"><span>${esc(m.league)} · ${fmtDate(m.utcDate)}</span>
      <span class="badge ${st.k === 'live' ? 'live' : ''}">${statusTH(m.status)}</span></div>`;
}

function rowIndex(pos) {
  const p = String(pos || '').toUpperCase();
  if (p.startsWith('G')) return 0;
  if (p.includes('M')) return 2;
  if (p.includes('B') || p.startsWith('D') || p.startsWith('CD')) return 1;
  return 3;
}

function pitchRows(side) {
  const st = side.starters.slice().sort((a, b) => (a.formationPlace || 99) - (b.formationPlace || 99));
  const counts = String(side.formation || '').split('-').map(Number).filter(n => n > 0);
  const okFormation = counts.length && counts.reduce((a, b) => a + b, 0) === st.length - 1 && st.every(p => p.formationPlace);
  if (okFormation) {
    const rows = [[st[0]]];
    let i = 1;
    counts.forEach(c => { rows.push(st.slice(i, i + c)); i += c; });
    return rows;
  }
  const rows = [[], [], [], []];
  st.forEach(p => rows[rowIndex(p.position)].push(p));
  return rows.filter(r => r.length);
}

function pitchSide(side, away) {
  const rows = pitchRows(side);
  const R = rows.length;
  return rows.map((row, ri) => {
    let x = R > 1 ? 6 + ri * (38 / (R - 1)) : 6;
    if (away) x = 100 - x;
    return row.map((p, i) => {
      let y = (i + 1) / (row.length + 1) * 100;
      if (away) y = 100 - y;
      const last = String(p.name).split(' ').slice(-1)[0];
      return `<div class="pp" style="left:${x}%;top:${y}%" title="${esc(p.name)}">${crest(p.name, p.photo)}${p.subbedOut ? '<em class="so">↩</em>' : ''}<span class="pn">${esc(p.jersey ?? '')} ${esc(last)}</span></div>`;
    }).join('');
  }).join('');
}

function pitchHTML(d) {
  const bar = (s, right) => s ? `<span class="pb ${right ? 'r' : ''}">${crest(s.team, s.logo)}<b>${esc(s.team)}</b><small>${esc(s.formation || '')}</small></span>` : '<span></span>';
  const subs = s => s ? `<div><div class="small" style="margin-bottom:4px">ตัวสำรอง · ${esc(s.team)}</div>${playerRows(s.substitutes)}</div>` : '';
  return `<div class="pitch-head">${bar(d.home)}${bar(d.away, true)}</div>
    <div class="pitch">${d.home ? pitchSide(d.home, false) : ''}${d.away ? pitchSide(d.away, true) : ''}</div>
    <div class="subs">${subs(d.home)}${subs(d.away)}</div>`;
}

async function openMatch(id) {
  const m = S.byId.get(Number(id));
  if (!m) return;
  openDialog('รายละเอียดการแข่งขัน', matchHeader(m) + '<div class="empty">กำลังโหลดแผนการเล่น...</div>');
  api('/api/history', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: m.id }) })
    .then(loadHistory).catch(() => {});
  try {
    const d = await api('/api/match/' + m.id);
    const body = d.available
      ? pitchHTML(d)
      : `<div class="empty">ยังไม่มีข้อมูลตัวจริง/แผนการเล่นของแมตช์นี้จาก ESPN<br><span class="small">${esc(d.error || ('ข้อมูลที่ ESPN ส่งมา: ' + (d.keys || []).join(', ')))}</span></div>`;
    openDialog('รายละเอียดการแข่งขัน', matchHeader(m) + body);
  } catch (e) {
    openDialog('รายละเอียดการแข่งขัน', matchHeader(m) + `<div class="empty">${esc(e.message)}</div>`);
  }
}

function miniMatch(m) {
  const has = m.homeScore != null && m.awayScore != null;
  return `<div class="pl link" data-open="${m.id}"><span>${esc(m.homeTeam)} ${has ? `${m.homeScore}-${m.awayScore}` : 'vs'} ${esc(m.awayTeam)}</span><span class="pos">${fmtDate(m.utcDate)}</span></div>`;
}

async function openTeam(league, id) {
  openDialog('ข้อมูลทีม', '<div class="empty">กำลังโหลด...</div>');
  try {
    const d = await api(`/api/team/${encodeURIComponent(league)}/${id}`);
    const t = d.team;
    const injured = d.injured.length
      ? d.injured.map(p => `<div class="pl warn"><span>${esc(p.name)}</span><span class="pos">${esc(p.injuries[0].status)}${p.injuries[0].detail ? ' · ' + esc(p.injuries[0].detail) : ''}</span></div>`).join('')
      : `<div class="small">${d.injuryDataAvailable ? 'ไม่มีนักเตะบาดเจ็บ' : 'ไม่มีข้อมูลการบาดเจ็บจากแหล่งข้อมูลนี้'}</div>`;
    const sec = (title, list) => list.length ? `<div class="lu"><h4>${title}</h4>${list.map(miniMatch).join('')}</div>` : '';
    openDialog(t.name || 'ข้อมูลทีม', `
      <div class="match-team" style="margin-bottom:12px">${crest(t.name || '?', t.logo, true)}
        <span>${esc(t.name)}</span>
        <span class="small">${esc(t.venue || '')} ${t.record ? '· ' + esc(t.record) : ''}</span></div>
      ${sec('🔴 กำลังแข่ง', d.live)}
      ${sec('แมตช์ถัดไป', d.upcoming)}
      ${sec('ผลล่าสุด', d.recent)}
      <div class="lu"><h4>🩹 นักเตะบาดเจ็บ</h4>${injured}</div>
      <div class="lu"><h4>รายชื่อนักเตะ (${d.players.length})</h4>${d.players.length ? playerRows(d.players) : '<div class="small">ไม่มีข้อมูล</div>'}</div>`);
  } catch (e) {
    openDialog('ข้อมูลทีม', `<div class="empty">โหลดข้อมูลทีมไม่ได้: ${esc(e.message)}</div>`);
  }
}

/* ================= Events ================= */
document.addEventListener('click', e => {
  const t = e.target;
  const el = sel => t.closest(sel);

  if (el('[data-star]')) {
    const m = S.byId.get(Number(el('[data-star]').dataset.star));
    if (m) {
      const on = S.favs.includes(m.homeTeam) || S.favs.includes(m.awayTeam);
      S.favs = on
        ? S.favs.filter(n => n !== m.homeTeam && n !== m.awayTeam)
        : [...new Set([...S.favs, m.homeTeam, m.awayTeam])];
      saveFavs();
      renderMatches();
    }
    return;
  }
  if (el('[data-team]')) { const x = el('[data-team]'); openTeam(x.dataset.lg, x.dataset.team); return; }
  if (el('[data-open]')) { openMatch(el('[data-open]').dataset.open); return; }
  if (el('.match')) { openMatch(el('.match').dataset.id); return; }
  if (el('.lh')) {
    const code = el('.lh').dataset.lg;
    S.closed.has(code) ? S.closed.delete(code) : S.closed.add(code);
    renderMatches();
    return;
  }
  if (el('.date')) { S.date = el('.date').dataset.d; render(); return; }
  if (el('[data-f]')) { S.filter = el('[data-f]').dataset.f; renderFilters(); renderMatches(); return; }
  if (el('[data-tab]')) { S.tab = el('[data-tab]').dataset.tab; render(); return; }
  if (el('[data-l]')) { S.league = el('[data-l]').dataset.l; S.tab = 'matches'; render(); loadStandings(); return; }
});

$('#q').addEventListener('input', e => { S.query = e.target.value; renderMatches(); });
$('#sort').addEventListener('change', loadStandings);
$('#btnClose').addEventListener('click', () => $('#matchDialog').close());
$('#matchDialog').addEventListener('click', e => { if (e.target.id === 'matchDialog') e.target.close(); });

$('#btnQueue').addEventListener('click', async () => {
  try { await api('/api/queue/process', { method: 'DELETE' }); await Promise.all([loadQueue(), loadHistory()]); }
  catch (err) { alert(err.message); }
});
$('#btnUndo').addEventListener('click', async () => {
  try { await api('/api/history/undo', { method: 'DELETE' }); await loadHistory(); }
  catch (err) { alert(err.message); }
});

async function loadAll() {
  const btn = $('#reload');
  btn.classList.add('spin');
  try {
    await Promise.all([loadMatches(), loadQueue(), loadHistory()]);
    await loadStandings();
  } catch (err) {
    $('#list').innerHTML = `<div class="empty">เกิดข้อผิดพลาด: ${esc(err.message)}</div>`;
  } finally {
    btn.classList.remove('spin');
  }
}
$('#reload').addEventListener('click', loadAll);

(async function init() {
  try { await loadLeagues(); } catch { /* ignore */ }
  await loadAll();
  setInterval(() => { loadMatches().then(loadQueue).catch(() => {}); }, 60 * 1000);
})();
